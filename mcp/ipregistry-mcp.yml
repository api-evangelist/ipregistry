tools:
- name: ipregistry_lookup_ip
  description: 'Look up complete intelligence for 1-1024 IPv4/IPv6 addresses in a single call: location
    (country, region, city, coordinates, postal), network and company (ASN, organization, route, type),
    mobile carrier, currency, time zone, and security signals (VPN, proxy, Tor, relay, abuser, attacker,
    bogon, cloud provider). Prefer the focused ipregistry_geolocate_ip / ipregistry_check_ip_security
    / ipregistry_lookup_ip_network tools when one facet is enough, or pass the fields parameter to select
    exactly what you need. Credits: 1 per uncached target (+1 per call when more than one must be fetched);
    cached repeats are free.'
- name: ipregistry_geolocate_ip
  description: 'Get the geographic location of 1-1024 IP addresses: continent, country, region, city,
    postal code, coordinates, languages, and time zone with current local time. Returns only location
    data - cheaper in tokens than ipregistry_lookup_ip. Credits: 1 per uncached target (+1 per call when
    more than one must be fetched); cached repeats are free.'
- name: ipregistry_check_ip_security
  description: 'Check security and anonymity signals for 1-1024 IP addresses: VPN, proxy, Tor / Tor exit,
    relay (is_anonymous summarizes these), known abuser or attacker (is_threat summarizes these), bogon,
    and cloud/hosting provider. Use it to assess fraud risk, filter bot traffic, or vet client IPs. Credits:
    1 per uncached target (+1 per call when more than one must be fetched); cached repeats are free.'
- name: ipregistry_lookup_ip_network
  description: 'Identify who operates 1-1024 IP addresses: ASN, organization, BGP route, connection type
    (isp, hosting, business, education, government), the company using the IP, and the mobile carrier
    (name, MCC, MNC) when applicable. Credits: 1 per uncached target (+1 per call when more than one must
    be fetched); cached repeats are free.'
- name: ipregistry_lookup_asn
  description: 'Look up routing and registration data for 1-16 Autonomous Systems, given as numbers (13335)
    or strings (''AS13335''): name, domain, country, type, regional registry, allocation date, announced
    prefix counts, and relationships (peers, upstreams, downstreams as AS numbers). Announced prefixes
    are omitted by default because large networks announce thousands; set include_prefixes=true to list
    them (capped at 100 per address family). Credits: 1 per uncached target (+1 per call when more than
    one must be fetched); cached repeats are free.'
- name: ipregistry_parse_user_agent
  description: 'Parse 1-256 User-Agent header strings into structured data: agent name/type/version, device
    brand and type, rendering engine, and operating system. Useful for log analysis and traffic classification.
    Results are keyed by the original string. Credits: 1 per uncached target (+1 per call when more than
    one must be fetched); cached repeats are free.'
- name: ipregistry_my_ip
  description: Discover the public IP address this MCP session originates from and return its full intelligence
    profile (location, network, security). On the hosted server this is the IP of the connected MCP client;
    on a local stdio server it is the machine's public egress IP. Costs 1 credit (cached repeats are free).
